<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#1A0F0A"/>
  <!-- Crosshatch pattern -->
  <defs>
    <pattern id="hatch" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="32" y2="32" stroke="#C9A84C" stroke-opacity="0.06" stroke-width="0.6"/>
      <line x1="32" y1="0" x2="0" y2="32" stroke="#C9A84C" stroke-opacity="0.06" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#hatch)"/>
  <!-- Diamond -->
  <polygon points="400,180 520,300 400,420 280,300" fill="#C9A84C" fill-opacity="0.12"/>
  <polygon points="400,224 463,300 400,376 337,300" fill="none" stroke="#C9A84C" stroke-opacity="0.2" stroke-width="1"/>
  <!-- JADY TAROT text -->
  <text
    x="400" y="488"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="14"
    letter-spacing="8"
    fill="#C9A84C"
    fill-opacity="0.45"
  >JADY TAROT</text>
</svg>
